[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_LEAD_ENDPOINT = "/api/leads"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

