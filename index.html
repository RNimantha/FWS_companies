    <meta charset="UTF-8" />
    <script>
      (function () {
        var preference;
        try {
          preference = localStorage.getItem("fwc-theme");
        } catch (e) {}
        var theme =
          preference === "light" || preference === "dark"
            ? preference
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
